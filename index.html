```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GHOSTI RADIO</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="app">

    <!-- HEADER -->
    <header class="header">

      <div class="brand">

        <img
          class="brand-avatar"
          src="ghosti_profile_x54g.jpg"
          alt="GHOSTI"
        >

        <div class="brand-text">
          <h1>GHOSTI RADIO</h1>
          <span id="trackCount">0 tracks</span>
        </div>

      </div>

      <button
        id="manageBtn"
        class="manage-btn"
        type="button"
      >
        +
      </button>

    </header>


    <!-- PLAYLIST -->
    <section
      id="playlist"
      class="playlist"
    ></section>


    <!-- PLAYER -->
    <section
      id="player"
      class="player hidden"
    >

      <div class="now-playing">

        <div>
          <div
            id="nowTitle"
            class="now-title"
          >
            Untitled
          </div>

          <div
            id="nowArtist"
            class="now-artist"
          >
            GHOSTI
          </div>
        </div>

      </div>


      <!-- PROGRESS -->
      <div class="progress-wrap">

        <span id="currentTime">0:00</span>

        <input
          id="progress"
          class="progress"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
        >

        <span id="duration">0:00</span>

      </div>


      <!-- CONTROLS -->
      <div class="controls">

        <button
          id="prevBtn"
          class="control-btn"
          type="button"
          aria-label="Previous"
        >
          ‹
        </button>

        <button
          id="playBtn"
          class="play-btn"
          type="button"
          aria-label="Play"
        >
          ▶
        </button>

        <button
          id="nextBtn"
          class="control-btn"
          type="button"
          aria-label="Next"
        >
          ›
        </button>

      </div>

    </section>


    <!-- MANAGEMENT PANEL -->
    <section
      id="managePanel"
      class="manage-panel hidden"
      aria-hidden="true"
    >

      <p>
        Add your music files to the repository and update
        <code>tracks.json</code>.
      </p>

    </section>

  </main>


  <!-- AUDIO -->
  <audio
    id="audio"
    preload="metadata"
  ></audio>


  <script src="app.js"></script>

</body>
</html>
```
