```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GHOSTI RADIO</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="radio">

    <!-- HEADER -->
    <header class="header">
      <div class="logo">GHOSTI RADIO</div>
      <div class="subtitle">INTERNET RADIO</div>
    </header>


    <!-- INTRO -->
    <section class="intro">

      <div class="eyebrow">WELCOME TO</div>

      <h1>GHOSTI</h1>

      <p class="description">
        A small place for music after midnight.
      </p>

    </section>


    <!-- PLAYER -->
    <section class="player">

      <div class="track-info">

        <div class="track-number">
          01
        </div>

        <div>
          <div class="track-title" id="nowTitle">
            GHOSTI RADIO
          </div>

          <div class="track-artist" id="nowArtist">
            Select a track
          </div>
        </div>

      </div>


      <div class="controls">

        <button
          id="prevBtn"
          type="button"
          aria-label="Previous track"
        >
          ←
        </button>

        <button
          id="playBtn"
          class="play"
          type="button"
          aria-label="Play"
        >
          ▶
        </button>

        <button
          id="nextBtn"
          type="button"
          aria-label="Next track"
        >
          →
        </button>

      </div>


      <div class="progress">
        <span id="progressBar"></span>
      </div>

      <div class="time">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>

    </section>


    <!-- FOOTER -->
    <footer class="footer">
      <span>GHOSTI</span>
      <span>01 TRACK</span>
    </footer>

  </main>


  <audio id="audio" preload="metadata"></audio>

  <script src="app.js"></script>

</body>
</html>
```
