<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GHOSTI RADIO</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="site">

```
<header class="brand">
  <div class="ghost">👻</div>

  <div class="radio-title">
    GHOSTI RADIO
  </div>

  <div class="radio-subtitle">
    late night transmissions
  </div>
</header>


<section class="playlist-wrap">

  <div class="playlist-head">
    <span id="trackCount">0 tracks</span>
  </div>

  <div id="playlist"></div>

</section>


<footer>
  GHOSTI RADIO · 2026
</footer>
```

  </main>

  <div id="player" class="player hidden">

```
<div class="now-playing">

  <div class="now-dot"></div>

  <div class="now-text">

    <div id="nowTitle">
      Nothing playing
    </div>

    <div id="nowArtist">
      GHOSTI
    </div>

  </div>

</div>


<button
  id="prevBtn"
  class="player-btn"
  type="button"
  aria-label="Previous"
>
  ‹
</button>


<button
  id="playBtn"
  class="play-btn"
  type="button"
  aria-label="Play"
>
  ▶
</button>


<button
  id="nextBtn"
  class="player-btn"
  type="button"
  aria-label="Next"
>
  ›
</button>


<div class="progress-area">

  <input
    id="progress"
    type="range"
    min="0"
    max="100"
    value="0"
    step="0.1"
  >

  <div class="time">

    <span id="currentTime">
      0:00
    </span>

    <span id="duration">
      0:00
    </span>

  </div>

</div>
```

  </div>

<audio
id="audio"
preload="metadata"

> </audio>

  <script src="app.js"></script>

</body>
</html>
