<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GHOSTI RADIO</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="radio">

    <header class="header">
      <div class="logo">GHOSTI</div>
      <div class="subtitle">RADIO</div>
    </header>

    <section class="intro">
      <p class="eyebrow">INDEPENDENT RADIO</p>

      <h1>
        GHOSTI<br>
        RADIO
      </h1>

      <p class="description">
        music for the hours<br>
        nobody talks about.
      </p>
    </section>

    <section class="player">

      <div class="track-info">
        <span class="track-number">01</span>

        <div>
          <div class="track-title">No Track Playing</div>
          <div class="track-artist">GHOSTI RADIO</div>
        </div>
      </div>

      <div class="controls">

        <button type="button" aria-label="Previous">
          ←
        </button>

        <button class="play" type="button" aria-label="Play">
          ▶
        </button>

        <button type="button" aria-label="Next">
          →
        </button>

      </div>

      <div class="progress">
        <span></span>
      </div>

      <div class="time">
        <span>0:00</span>
        <span>0:00</span>
      </div>

    </section>

    <footer class="footer">
      <span>GHOSTI RADIO</span>
      <span>2026</span>
    </footer>

  </main>

  <script src="app.js"></script>

</body>
</html>
