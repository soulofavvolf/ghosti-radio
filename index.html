```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GHOSTI RADIO</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="radio">

    <header class="header">
      <div class="logo">GHOSTI RADIO</div>
      <div class="subtitle">ONLINE / 001</div>
    </header>


    <section class="intro">
      <div class="eyebrow">INDEPENDENT RADIO</div>

      <h1>GHOSTI</h1>

      <p class="description">
        A small radio for late nights,
        quiet rooms and sounds that stay.
      </p>
    </section>


    <section class="player">

      <div class="track-info">

        <div class="track-number" id="trackNumber">
          01
        </div>

        <div>
          <div class="track-title" id="trackTitle">
            No track playing
          </div>

          <div class="track-artist" id="trackArtist">
            GHOSTI
          </div>
        </div>

      </div>


      <div class="controls">

        <button
          id="prevBtn"
          type="button"
          aria-label="Previous track"
        >
          ←
        </button>

        <button
          id="playBtn"
          class="play"
          type="button"
          aria-label="Play"
        >
          ▶
        </button>

        <button
          id="nextBtn"
          type="button"
          aria-label="Next track"
        >
          →
        </button>

      </div>


      <div class="progress">
        <div id="progressBar"></div>
      </div>

      <div class="time">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>

    </section>


    <footer class="footer">
      <span id="trackCount">0 tracks</span>
      <span>GHOSTI / RADIO</span>
    </footer>

  </main>


  <audio id="audio" preload="metadata"></audio>

  <script src="app.js"></script>

</body>
</html>
```
